stages:
    - prebuild
    - build
    - test
    - docs

variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

reuse:
    image:
        name: fsfe/reuse:latest
        entrypoint: [""]
    stage: prebuild
    script:
        - reuse lint

clang-format:
    image: debian:testing-slim
    stage: prebuild
    before_script:
        - apt-get update && apt-get install -y clang-format git
    script:
        - git-clang-format HEAD~1

build-image:
    stage: build
    tags: ["dind"]
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    script:
        - docker build --build-arg CI_JOB_TOKEN="$CI_JOB_TOKEN" -t $IMAGE_TAG .
        - docker push $IMAGE_TAG

test:
    stage: test
    image: $IMAGE_TAG
    script:
        - cd /app
        - make check -j$(nproc)

docs:docs:
    stage: docs
    image: $IMAGE_TAG
    script:
        - cd /app
        - make docs

docs:deploy:
    stage: docs
    image: $IMAGE_TAG
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    script:
        - cd /app
        - make docs
    pages: true
    artifacts:
        paths:
          - public
