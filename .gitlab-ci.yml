stages:
    - prebuild
    - build
    - test
    - docs

variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

reuse:
    image:
        name: fsfe/reuse:latest
        entrypoint: [""]
    stage: prebuild
    script:
        - reuse lint

clang-format:
    image: debian:testing-slim
    stage: prebuild
    before_script:
        - apt-get update && apt-get install -y clang-format git
    script:
        - git-clang-format HEAD~1

build-image:
    stage: build
    tags: ["dind"]
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    script:
        - docker build --build-arg CI_JOB_TOKEN="$CI_JOB_TOKEN" --build-arg ENABLE_COVERAGE=1 -t $IMAGE_TAG .
        - docker push $IMAGE_TAG

